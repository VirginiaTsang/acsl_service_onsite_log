<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match sender names</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><header class="page-head"><div><p class="eyebrow">STEP 2 OF 3</p><h1>Match sender names</h1>
    <!-- <p class="muted">Map each export-specific sender label to the engineer’s display name.</p> -->
</div></header><nav class="steps"><a href="/">Dashboard</a><a href="/upload">1 · Upload</a><a class="active" href="/mappings">2 · Match names</a><a href="/review">3 · Review messages</a></nav><section class="panel"><form action="/mappings" method="post"><table><thead><tr><th>Raw sender</th><th>Engineer name</th></tr></thead><tbody>{% for m in mappings %}<tr><td><code>{{ m.raw_sender }}</code><input type="hidden" name="raw_senders" value="{{ m.raw_sender }}"></td><td><input type="text" name="matched_names" value="{{ m.matched_name }}" required></td></tr>{% else %}<tr><td colspan="2">No senders yet. Upload a chat file first.</td></tr>{% endfor %}</tbody></table><button class="button primary" type="submit">Save and review messages</button></form></section></main></body></html>
