<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selected messages</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container">
<header class="page-head"><div><p class="eyebrow">REVIEW MESSAGES</p><h1>Selected messages</h1>
    <!-- <p class="muted">A complete list of messages currently included in the site analysis.</p> -->
</div><a class="button primary" href="/review">Back to message review</a></header>
{% if error_message %}<div class="error">{{ error_message }}</div>{% endif %}
<section class="panel"><form method="get" action="/review/selected" class="filters"><label>Engineer<select id="sender" name="sender"><option value="">All engineers</option>{% for name in sender_options %}<option value="{{ name }}" {% if selected_sender == name %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></label><label>From date<input type="date" name="start_date" value="{{ start_date }}"></label><label>To date (inclusive)<input type="date" name="end_date" value="{{ end_date }}"></label><button class="button primary" type="submit">Apply filters</button><a class="button" href="/review/selected">Clear</a></form></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>Engineer</th><th>Date</th><th>Time</th><th>Selected message</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.name }}</td><td>{{ row.date }}</td><td>{{ row.time }}</td><td class="msg-text">{{ row.message }}</td></tr>{% else %}<tr><td colspan="4">No selected messages match these filters.</td></tr>{% endfor %}</tbody></table></div></section></main></body></html>
